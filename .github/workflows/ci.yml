# Единый baseline CI (без docker compose внутри job).
# Порядок шагов — fail-fast: сначала дешёвые проверки, затем сборки.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Secret leak check
        run: bash scripts/check-sensitive-log-leaks.sh

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Gradle test
        run: ./gradlew test --no-daemon

      - name: Gradle build
        run: ./gradlew build --no-daemon

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            forecasting/requirements.txt
            forecasting/requirements-dev.txt

      - name: Forecasting — install & baseline
        working-directory: forecasting
        env:
          APP_ENV: dev
          ALLOW_INSECURE_DEV_SECRETS: "true"
          # 32+ bytes base64; api.py validates secret at import (dev + insecure allows placeholders off)
          FORECAST_INTERNAL_JWT_SECRET_B64: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
        run: |
          python3 -m pip install --upgrade "pip>=24.0,<25"
          python3 -m pip install -r requirements-dev.txt
          python3 -m compileall -q .
          python3 -c "import api"
          python3 -m pytest tests/test_api_backward_compat.py tests/test_registry.py -q --tb=short

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: telegram-payment-service/package-lock.json

      - name: Telegram payment service — install, generate, build, test
        working-directory: telegram-payment-service
        run: |
          npm ci
          npx prisma generate
          npm run build
          npm test -- --passWithNoTests
